<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation 4 | Chai aur code</title>
</head>
<body style="background-color : #212121; color: antiquewhite ; padding : 15px ">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    // Function to add a language to the list
    function addLanguage(langName) {
        // Create a new list item element
        const li = document.createElement("li");
        
        // Set the inner HTML of the list item to the language name
        li.innerHTML = langName;
        
        // Append the list item to the .language element
        document.querySelector(".language").appendChild(li);
    }
    
    // Call the function to add "Python" to the list
    addLanguage("Python");

    // Optimized function to add a language to the list
    function addLanguageInOptimizeWay(langName) {
        // Create a new list item element
        const li = document.createElement("li");
        
        // Create a text node with the language name
        // Append the text node to the list item
        li.appendChild(document.createTextNode(langName));
        
        // Append the list item to the .language element
        document.querySelector(".language").appendChild(li);
    }

    // Call the optimized function to add "C++" to the list
    addLanguageInOptimizeWay("C++");
    addLanguageInOptimizeWay("Java");


    // Edit 

    // By innerHTML
    const secondLang = document.querySelector("li:nth-child(2)")
    // secondLang.innerHTML = "Ruby";

    // Doing the same thing by creating another element

    const newList = document.createElement('li')
    newList.textContent = "Ruby";
    secondLang.replaceWith(newList);

    // By outerHTML
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = "<li>TypeScript</li>";


    // Remove

    const lastLang = document.querySelector('li:last-child')
    lastLang.remove();
    


</script>

</html>
