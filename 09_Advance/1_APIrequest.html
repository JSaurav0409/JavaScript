<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMLHttpRequest</title>
</head>
<body style="background-color:#212121; color:antiquewhite ; padding : 15px">
0	UNSENT	Client has been created. open() not called yet. <br>
1	OPENED	open() has been called. <br>
2	HEADERS_RECEIVED	send() has been called, and headers and status are available. <br>
3	LOADING	Downloading; responseText holds partial data. <br>
4	DONE	The operation is complete. <br>
</body>
<script>
    const URL = 'https://api.github.com/users/JSaurav0409 ' ;
    const xhr = new XMLHttpRequest();
    xhr.open('GET', URL);

    xhr.onreadystatechange = function(){
        console.log(xhr.readyState);
        if(xhr.readyState === 4){
            //const data = this.responseText;
            //console.log(typeof(data)); // returns data in the form of String.

            const data = JSON.parse(this.responseText);
            console.log(data.avatar); // returns data in the form of Object
        }
    }

    xhr.send() ;
</script>
</html>
